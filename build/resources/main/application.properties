# アプリケーション名
spring.application.name=hermes-way

# PostgreSQL接続設定
spring.datasource.url=jdbc:postgresql://localhost:5433/hermes_way
spring.datasource.username=hermes_user
spring.datasource.password=hermes_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT設定
jwt.secret=${JWT_SECRET}